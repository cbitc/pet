version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 开发工具批量更新，减少 PR 噪声；运行时依赖不分组，逐个评审
      dev-dependencies:
        dependency-type: development
    ignore:
      # Electron 大版本升级需人工评估（透明窗 / 原生合成行为敏感）
      - dependency-name: electron
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
